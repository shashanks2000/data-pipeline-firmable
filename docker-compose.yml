version: '3.8'

services:
  postgres:
    image: postgres:13
    restart: always
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      # mount local initdb SQL scripts so Postgres will run them at first start
      - ./initdb:/docker-entrypoint-initdb.d:ro
    ports:
      # Use 5433 on host to avoid conflict with existing Postgres on 5432
      - "5432:5432"

  airflow:
    build: .
    image: airflow-custom:latest
    depends_on:
      - postgres
    environment:
      # Use the sequential executor for a simple single-container setup
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      # point Airflow metadata DB to the Postgres service
      AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      # prevent example DAGs from loading
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      PYTHONPATH: /opt/airflow/project
    volumes:
      # mount whole repo (project) inside container so code paths remain the same
      - ./:/opt/airflow/project
      # mount the dags folder (Airflow expects DAGs here)
      - ./dags:/opt/airflow/dags
    ports:
      # Use 8080 on host to avoid conflict with other services on 8080
      - "8081:8080"
    command: bash -c "airflow db upgrade && airflow users create --username admin --firstname Admin --lastname User --role Admin --email admin@example.com --password admin || true && airflow scheduler & exec airflow webserver"

volumes: {}

